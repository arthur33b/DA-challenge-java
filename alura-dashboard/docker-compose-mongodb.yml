version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: alura-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: alura_dashboard
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      # Volumes para persistência de dados
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      # Script de inicialização (opcional)
      - ./mongodb_init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - alura-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Express - Interface Web para gerenciamento
  mongo-express:
    image: mongo-express:latest
    container_name: alura-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - alura-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Aplicação Spring Boot (opcional - descomente se necessário)
  # alura-dashboard-app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.mongodb
  #   container_name: alura-dashboard-app
  #   restart: always
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/alura_dashboard?authSource=admin
  #     SPRING_PROFILES_ACTIVE: mongodb
  #   networks:
  #     - alura-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/api/mongodb/cursos/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  alura-network:
    driver: bridge

# ==================== INSTRUÇÕES DE USO ====================
# 
# 1. Iniciar os serviços:
#    docker-compose -f docker-compose-mongodb.yml up -d
#
# 2. Acessar MongoDB Express (Interface Web):
#    http://localhost:8081
#    Usuário: admin
#    Senha: admin123
#
# 3. Conectar ao MongoDB via mongosh ou cliente:
#    mongodb://admin:admin123@localhost:27017/alura_dashboard?authSource=admin
#
# 4. Verificar logs:
#    docker-compose -f docker-compose-mongodb.yml logs -f mongodb
#    docker-compose -f docker-compose-mongodb.yml logs -f mongo-express
#
# 5. Parar os serviços:
#    docker-compose -f docker-compose-mongodb.yml down
#
# 6. Remover volumes (CUIDADO - deleta dados!):
#    docker-compose -f docker-compose-mongodb.yml down -v
#
# ==================== VARIÁVEIS DE CONEXÃO ====================
#
# Host: localhost ou mongodb (se dentro de rede Docker)
# Porta: 27017
# Database: alura_dashboard
# Username: admin
# Password: admin123
# Auth Source: admin
#
# Connection String para aplicação Spring Boot:
# spring.data.mongodb.uri=mongodb://admin:admin123@mongodb:27017/alura_dashboard?authSource=admin
#
