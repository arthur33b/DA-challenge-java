# ==================== MONGODB CONFIGURATION ====================
# Profile específico para MongoDB
# Para ativar: java -jar app.jar --spring.profiles.active=mongodb
# Ou: export SPRING_PROFILES_ACTIVE=mongodb

# MongoDB Connection (Local)
spring.data.mongodb.uri=mongodb://admin:admin123@localhost:27017/alura_dashboard?authSource=admin
spring.data.mongodb.database=alura_dashboard

# MongoDB Connection (Docker) - Descomente se usar Docker
# spring.data.mongodb.uri=mongodb://admin:admin123@mongodb:27017/alura_dashboard?authSource=admin
# spring.data.mongodb.database=alura_dashboard

# MongoDB Configuration
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uuid-representation=standard

# Desabilitar JPA quando usar MongoDB
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Logging para MongoDB
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.mongodb.driver=INFO
logging.level.com.alura.dashboard=DEBUG

# Server configuration
server.port=8080

# Application Name
spring.application.name=Alura Dashboard MongoDB
