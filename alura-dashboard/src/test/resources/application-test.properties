# Test Configuration - MongoDB Profile
# Use este arquivo para configurar o ambiente de teste com MongoDB

# Server
server.port=8080
server.servlet.context-path=/

# MongoDB Test Configuration
spring.data.mongodb.uri=mongodb://admin:admin123@localhost:27017/alura_dashboard_test?authSource=admin
spring.data.mongodb.database=alura_dashboard_test
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.org.springframework=INFO
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.alura.dashboard=DEBUG
logging.level.com.mongodb.client=INFO

# Test Database
spring.test.database.replace=any

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
